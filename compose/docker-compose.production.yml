name: midtnvbc

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ./envs/.env.production
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:alpine
    restart: unless-stopped

  api:
    image: ghcr.io/${GHCR_IMAGE:?Set GHCR_IMAGE to the lowercase GitHub owner/repository}:production
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    env_file:
      - ./envs/.env.production
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    expose:
      - "8080"
    volumes:
      - static-data:/app/dist

  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    command: --label-enable --registry-auth --cleanup --interval 300
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker/config.json:/config.json:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/Caddyfile:/etc/caddy/Caddyfile:ro
      - static-data:/srv/static:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-config:
  caddy-data:
  db-data:
  static-data:
