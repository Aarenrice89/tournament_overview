{% extends "tournaments/base.html" %}

{% block title %}Remove {{ object.name }}{% endblock %}

{% block content %}
  <section class="card p-4 mx-auto" style="max-width: 42rem;">
    <h1 class="h3">Remove {{ object.name }}?</h1>
    <p class="text-muted">This permanently removes the tournament and its team registration records. Reusable teams will remain available.</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Remove tournament</button>
      <a class="btn btn-outline-secondary" href="{% url 'tournaments:detail' object.pk %}">Cancel</a>
    </form>
  </section>
{% endblock %}
