{% extends "tournaments/base.html" %}

{% block title %}Teams{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4 page-header ps-3">
    <div><h1 class="h2 mb-1">Reusable teams</h1><p class="text-muted mb-0">Teams can be entered in any tournament.</p></div>
    <a class="btn btn-primary" href="{% url 'tournaments:team-create' %}">Add team</a>
  </div>
  <div class="card p-0 overflow-hidden">
    <ul class="list-group list-group-flush">
      {% for team in teams %}
        <li class="list-group-item d-flex justify-content-between align-items-center"><span>{{ team.name }}</span><a class="btn btn-sm btn-outline-primary" href="{% url 'tournaments:team-update' team.pk %}">Edit</a></li>
      {% empty %}
        <li class="list-group-item text-muted">No teams have been added.</li>
      {% endfor %}
    </ul>
  </div>
{% endblock %}
