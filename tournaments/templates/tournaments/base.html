{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Tournament Overview{% endblock %}</title>
    <link rel="icon" href="{% static 'tournament_overview/images/mtnvbc-favicon.png' %}" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="{% static 'tournament_overview/portal.css' %}" rel="stylesheet">
    <style>
      :root { --navy: #13293d; --teal: #1985a1; --sand: #f5f1e8; }
      body { background: var(--sand); color: #1f2933; }
      .page-header { border-left: 5px solid var(--teal); }
      .card, .table-responsive { box-shadow: 0 .2rem .8rem rgb(19 41 61 / 8%); }
      .status { border-radius: 999px; font-size: .75rem; font-weight: 700; padding: .3rem .55rem; white-space: nowrap; }
      .status-pending { background: #e9ecef; color: #495057; }
      .status-registered { background: #FFF2CC; color: #735c0f; }
      .status-paid { background: #C6EFCE; color: #084298; }
      .status-complete { background: #9FC5E8; color: #0f5132; }
      .registration-status { border-radius: 999px; font-size: .75rem; font-weight: 700; padding: .3rem .55rem; white-space: nowrap; }
      .registration-status-pending { background: #fff3cd; color: #664d03; }
      .registration-status-accepted { background: #d1e7dd; color: #0f5132; }
      .team-line { align-items: center; display: grid; gap: .35rem; grid-template-columns: minmax(8rem, 1fr) auto; margin-bottom: .3rem; }
      .team-line-heading { border-bottom: 1px solid #e9ecef; padding-bottom: .2rem; }
      .team-status-group-title { font-size: .95rem; }
      .team-status-group + .team-status-group { border-top: 1px solid #dee2e6; margin-top: .75rem; padding-top: .75rem; }
      .btn-check:checked + .registration-status-pending-toggle { background: #fff3cd; border-color: #ffecb5; color: #664d03; }
      .btn-check:checked + .registration-status-accepted-toggle { background: #d1e7dd; border-color: #badbcc; color: #0f5132; }
      fieldset { background: #fff; border: 0; border-radius: .5rem; margin-bottom: 1.25rem; padding: 1.25rem; }
      legend { color: var(--navy); font-size: 1.05rem; font-weight: 700; padding: 0 .25rem; width: auto; }
      .form-check { padding-top: 2rem; }
      .required label::after { color: #b02a37; content: " *"; }
    </style>
  </head>
  <body class="portal-body">
    <nav class="navbar navbar-expand-sm navbar-dark portal-header portal-header--admin mb-4">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="{% url 'landing' %}"><img class="portal-logo" src="{% static 'tournament_overview/images/mtnvbc-logo.png' %}" alt="Mid TN Volleyball Club"><span class="portal-title">Admin Portal</span></a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="{% url 'tournaments:list' %}">Tournament Overview</a>
          <a class="nav-link" href="{% url 'tournaments:team-list' %}">Teams</a>
          <form class="ms-2" method="post" action="{% url 'coaches:logout' %}">
            {% csrf_token %}
            <button class="btn btn-outline-light" type="submit">Log out</button>
          </form>
        </div>
      </div>
    </nav>
    <main class="container pb-5">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
